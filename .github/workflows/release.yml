name: release

# A tag is the release. Pushing `v*` builds the bundle from that tag and attaches
# the archive and its checksum to a GitHub release for it, so what a friend
# downloads is built from the tag they can read.
#
# The job runs on macOS because the app is macOS: the tray and the login item are
# macOS-only, and Whirl.app is a macOS bundle (the other platforms are
# docs/milestones.md M4, which waits on whirl). The version comes from the tag that
# triggered the run, and `scripts/make-bundle.sh` takes it from there.
#
# The signature in the archive is ad-hoc, with no notarization, which is a
# deliberate choice: the release notes say so, and the install notes carry the
# first-launch step a quarantined copy needs. Nothing here implies a Developer ID.
#
# A release is a tag on `main`, and nothing else. That rule is enforced here, not
# assumed: the first job, `guard`, fails unless the tagged commit is an ancestor of
# `origin/main`, and `bundle` names it in `needs:`, so a tag pushed anywhere else
# builds nothing and publishes nothing. Ancestry covers both legitimate cases: a
# tag exactly at `main`'s tip (a commit is its own ancestor, and the job says so),
# and `main` having moved ahead of the tag since it was cut (the tagged commit is
# still in `main`'s history, so the release is still the release that commit
# describes).
#
# The second gate is about the file a reader is told to run rather than about history.
# `install.sh` names the two releases it installs as hand-kept defaults of its own, and
# nothing compared them with the tag until this gate existed. v0.2.1 was tagged with both
# of them still reading 0.2.0: the documented route installed the app before this one, and
# the daemon with it, while the release page, the archive and the checksum all said 0.2.1.
# `pin` runs that comparison against the tag, and `bundle` waits behind it too, so a
# release whose script points at another release publishes nothing.

on:
  push:
    tags: ['v*']
  # The same artifact, on a tag that does not exist yet, for a run that has to be
  # repeatable before the release is cut. The gates below apply to this trigger too,
  # and `pin` needs the version typed here, so a rehearsal names the release it is
  # rehearsing rather than taking what the checkout happens to carry.
  workflow_dispatch:
    inputs:
      version:
        description: the version to build and release, as the tag spells it (v0.2.1)
        required: true

permissions:
  # The release and its assets are written with the workflow's own token: no
  # secret is stored for this and none is needed.
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # First in the graph, and `bundle` waits behind it: a tag that is not on `main`
  # must publish nothing at all, and that is only true if this job is the gate the
  # publishing job names in `needs:`. The rule it enforces (a release is a tag on
  # `main`) is a fact about history, so this job is a fetch and one ancestry
  # question.
  guard:
    name: guard (${{ github.ref_name }} is on main)
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, because the check below asks a question about history and
      # the default shallow checkout cannot answer it: with no history fetched,
      # `git merge-base --is-ancestor` cannot connect the tagged commit to `main`
      # and fails for every tag, `main`'s own tip included. Fetching the
      # repository's history is the whole cost. It is safe because this job only
      # reads: the job writes nothing, pushes nothing and is given no secret. The
      # step below refuses to decide at all when `origin/main` is not in the
      # checkout, so a checkout setting that regresses fails closed rather than
      # open.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refuse a tag whose commit is not on main
        shell: bash
        env:
          # The tag and the commit reach this script through `env:`: no event
          # payload is spliced into a `run:` step.
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if ! git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null; then
            echo "::error::origin/main is not in this checkout, so this job cannot say whether $TAG is on main. Refusing rather than publishing a release that nothing checked; the checkout needs the repository's history (fetch-depth: 0)."
            exit 1
          fi
          main=$(git rev-parse origin/main)
          echo "tag $TAG points at $SHA"
          echo "origin/main is $main"
          if git merge-base --is-ancestor "$SHA" origin/main; then
            if [ "$SHA" = "$main" ]; then
              echo "the tagged commit is main's tip"
            else
              echo "the tagged commit is an ancestor of main, which has moved ahead of it since the tag was cut; the release still describes the tagged commit"
            fi
            exit 0
          fi
          common=$(git merge-base "$SHA" origin/main || true)
          if [ -n "$common" ]; then
            echo "ancestry: $SHA is NOT an ancestor of origin/main; the two share history up to $common"
          else
            echo "ancestry: $SHA is NOT an ancestor of origin/main, and the two share no history at all"
          fi
          echo "::error::$TAG is not on main, so it is not a release. Nothing was built and no release will be published. A release is a tag on main: delete this tag, get the commit onto main, and tag main's tip."
          exit 1

  # The gate about the script rather than about history. It reads one file out of the
  # checkout of the ref this run is for, so it needs no depth and nothing built: the
  # comparison is `scripts/check-release-pins.sh`, which fails when the two defaults
  # `install.sh` carries do not name this tag.
  pin:
    name: pin (${{ github.ref_name }} install.sh)
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - uses: actions/checkout@v5
      - name: Refuse a release whose install.sh installs the wrong releases
        shell: bash
        env:
          # The version reaches this step the way it reaches `bundle`: from the tag on a
          # push, and from the input on a dispatch. No event payload is spliced into a
          # `run:` step.
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          TYPED: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT" = "push" ]; then
            version="$TAG"
          else
            version="$TYPED"
          fi
          scripts/check-release-pins.sh "$version"

  bundle:
    name: bundle (macos-latest)
    runs-on: macos-latest
    needs: [guard, pin]
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain and its components
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: The version, from the tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          TYPED: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then
            version="$TAG"
          else
            version="$TYPED"
          fi
          # The version names a filename and a release, so it is checked rather
          # than trusted: a tag that is not a version is a run that stops here.
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "release: $version is not a version tag (v<major>.<minor>.<patch>)" >&2
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the bundle and the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/make-bundle.sh "$VERSION"

      - name: Publish the archive, its checksum, and a pointer to the notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # The release page says nothing of its own: it points at the document, so
          # the words live in one place and the page cannot drift from them. A page
          # that points at a file the tag does not carry is worse than no page, so a
          # missing notes file stops this run instead of publishing a dead link.
          notes="docs/releases/$VERSION.md"
          if [ ! -f "$notes" ]; then
            echo "::error::no release notes at $notes, so this release would point at nothing. Write the notes for $VERSION, land them on main, and rerun."
            exit 1
          fi
          gh release create "$VERSION" \
            --title "whirl-ui $VERSION" \
            --notes "Whirl.app $VERSION, and what this build is: https://github.com/$REPO/blob/$VERSION/$notes" \
            dist/*.zip dist/*.zip.sha256
