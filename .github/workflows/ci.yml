name: ci

# fmt, clippy and test. Clippy and test run on the three operating systems the
# daemon targets. The tray is macOS-first: macOS-only code is gated behind
# `#[cfg(target_os = "macos")]`, so the Linux and Windows legs compile the same
# workspace and stay green.
#
# The toolchain comes from `rust-toolchain.toml`, so `rustup show` installs the
# pinned channel and its rustfmt and clippy components before anything runs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain and its components
        run: rustup show
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain and its components
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain and its components
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace
