[package]
name = "whirl-ui"
description = "the whirl tray app: a lightweight menu bar frontend for the whirl daemon, macOS first"
version.workspace = true
edition.workspace = true
# The workspace floor plus one step: the window is egui through eframe 0.36.2,
# whose MSRV is 1.95. `rust-toolchain.toml` carries the same version, so the
# pinned toolchain and this manifest agree with the dependency by construction.
# `whirlui-client` keeps the workspace floor: nothing about talking the protocol
# needs 1.95.
rust-version = "1.95.0"
license.workspace = true
repository.workspace = true

[dependencies]
whirlui-client = { workspace = true }
# The window, and the renderer under it: egui through eframe, the pair whirl's
# `docs/research/frontend-stack.md` chose by measurement over Tauri and over Swift
# with AppKit. Default features are off, so the build needs no platform's
# windowing headers and the three CI legs compile one crate rather than three
# variants of one; `glow` is the GL renderer, which needs no compute pipeline to
# draw a dialog, and `default_fonts` is the one place the text comes from.
#
# `x11` and `wayland` are the two backends winit has on Linux. They are not
# optional there: with neither, winit's own `compile_error!("The platform you're
# compiling for is not supported by winit")` stops the build, which is how the
# ubuntu leg of CI first failed. On macOS they are inert, and the tray is
# macOS-first, but this workspace's suite and lint run on all three platforms.
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
# One PNG, for `--screenshot`. The window is the one deliverable a test cannot
# produce, so when a maintainer asks for a screenshot the app writes its own
# pixels: the screen would carry whatever else the machine was showing.
png = "0.17"
# The one write path's document model, for the config file the daemon reads. The
# file is edited as the JSON document it is rather than round-tripped through
# `whirl-core`'s `Config`, because `Config` holds the schema's values and a round
# trip through it would drop every key the schema does not name. `preserve_order`
# is the point rather than a preference: without it the annotated file's keys
# would come back sorted, and the comment keys its reader depends on would move
# away from the values they annotate. The parser that judges the result is still
# `whirl-core`'s, on the exact bytes about to land (see `config_file.rs`).
serde_json = { version = "1", features = ["preserve_order"] }

# Everything below is macOS-only, and every crate here is declared that way rather
# than merely cfg-gated in the code: a target-specific dependency keeps them out of
# the Linux and Windows builds entirely.
#
# The tray. `tray-icon` is the status item and its menu; `winit` is here for one
# call that eframe does not surface: the macOS activation policy (see `tray.rs`),
# which is what keeps the app out of the Dock. It is the same 0.30 line eframe
# itself depends on, so it is one crate and not two.
#
# The `objc2` bindings are here for the item's accessible name. `tray-icon` sets
# the tooltip but exposes no call for the accessibility label, and a status
# button with no title has no accessible name at all, so the one setter the
# crate does expose (`TrayIcon::ns_status_item`) is called through the same
# bindings `tray-icon` is built on: the same versions, already in the graph, and
# the accessibility protocol is the feature that carries the setter.
#
# The folder panel is the second use of the same bindings, and the reason its
# features are listed below. `settings::ask_the_panel` is one call to
# `NSOpenPanel`, and these features are the classes it stands on: `NSOpenPanel`
# and its `NSSavePanel`/`NSPanel`/`NSWindow`/`NSResponder` superclasses, plus
# `NSApplication`, which is what `runModal`'s own gate names. No new framework
# arrives with any of them: AppKit is already linked, through `tray-icon` and
# through eframe's winit, so this is one more call into a framework already on
# the machine rather than a second copy of the platform bindings.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
winit = { version = "0.30", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSWindow",
] }
# `NSBundle` is here for one question the login item answers before it registers
# anything: is this executable inside an app bundle at all, and which one. Without
# a bundle identifier there is nothing for macOS to register, and saying so is
# better than registering the directory the binary happens to sit in. `NSString`
# is the tray's, already used for the accessible name.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSBundle",
    "NSError",
    "NSString",
] }
# The app's own login item. `SMAppService.mainApp` is the API for an app's own
# bundle (macOS 13+), and it is the mechanism the login item is registered with:
# the bundle registers itself, so the Login Items pane has a name to show, which
# is `CFBundleName` in the Info.plist `scripts/make-bundle.sh` writes. Default
# features are off because the crate's default set pulls in block2,
# CoreFoundation and Security for APIs this app never calls.
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "SMAppService",
    "objc2",
    "objc2-foundation",
] }
