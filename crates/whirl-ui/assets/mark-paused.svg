<!-- The paused mark: the whirl's outer turn, wound around a pause.
     One drawing in the same 16x16 box as mark.svg, and it inks the same pixels
     of that box, so the menu bar item's width is that of a single mark in both
     states. Drawn for this repository; see README.md here. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="512" height="512">
  <circle cx="8" cy="8" r="5.824" fill="none" stroke="#000000" stroke-width="2.2"/>
  <rect x="5.00" y="4.00" width="2.00" height="7.00" rx="0.85" fill="#000000"/>
  <rect x="9.00" y="4.00" width="2.00" height="7.00" rx="0.85" fill="#000000"/>
</svg>
